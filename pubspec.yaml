name: ahfad_alsahaba
description: "أحفاد الصحابة: مسابقات إسلامية، قصص الصحابة، ألغاز قرآنية، وتحديات ثقافية"
publish_to: 'none'

version: 1.0.6+7

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  audioplayers: ^6.5.1
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  screenshot: ^3.0.0
  nearby_connections: ^4.0.0
  permission_handler: ^11.3.1
  flutter_speed_dial: ^7.0.0
  location: ^8.0.1
  url_launcher: ^6.3.0
  # Google Sign-In & Supabase
  google_sign_in: ^6.2.2
  supabase_flutter: ^2.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A0F2E"
  adaptive_icon_foreground: "assets/images/logo.png" 

flutter:
  uses-material-design: true
  assets:
    - assets/questions/
    - assets/data/library/
    - assets/data/salaf_quotes.json
    - assets/images/
    - assets/audio/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
